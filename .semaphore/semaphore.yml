version: v1.0
name: "\U0001F525 Phoenix CI Pipeline"
agent:
  machine:
    type: s1-kubernetes
    os_image: ''
  containers:
    - name: main
      image: 'registry.semaphoreci.com/elixir:1.15'
    - name: postgres
      image: 'registry.semaphoreci.com/postgres:17'
    - name: redis
      image: 'registry.semaphoreci.com/redis:7.0'
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - mix local.hex --force
      - mix local.rebar --force
      - mix deps.get
      - cache restore
blocks:
  - name: "\U0001F6E0️ Setup and Cache"
    dependencies: []
    task:
      jobs:
        - name: "\U0001F4E6 Install Dependencies"
          commands:
            - mix deps.compile
            - mix compile
            - npm ci --prefix assets
            - cache store
  - name: "\U0001F3A8 Assets"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: "\U0001F58C️ Compile Assets"
          commands:
            - npm run deploy --prefix assets
            - mix phx.digest
  - name: "\U0001F50D Code Quality"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: ✨ Lint and Format
          commands:
            - mix format --check-formatted
            - mix credo --strict
            - cd assets && npm run lint
  - name: "\U0001F510 Security Checks"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: "\U0001F6E1️ Security Scan"
          commands:
            - mix deps.audit
            - mix sobelow --config
            - cd assets && npm audit
  - name: "\U0001F4CA Dialyzer"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
    task:
      jobs:
        - name: "\U0001F50E Type Checking"
          commands:
            - mix dialyzer
  - name: "\U0001F9EA Test Suite"
    dependencies:
      - "\U0001F6E0️ Setup and Cache"
      - "\U0001F3A8 Assets"
    task:
      env_vars:
        - name: MIX_ENV
          value: test
        - name: DATABASE_URL
          value: 'postgresql://postgres@postgres:5432/app_test'
        - name: REDIS_URL
          value: 'redis://redis:6379'
      jobs:
        - name: "\U0001F7E2 ExUnit Tests"
          parallelism: 4
          commands:
            - mix ecto.create
            - mix ecto.migrate
            - mix test --cover
  - name: "\U0001F310 Browser Tests"
    dependencies:
      - "\U0001F9EA Test Suite"
    task:
      jobs:
        - name: "\U0001F3AD Wallaby Tests"
          commands:
            - mix wallaby.install
            - 'mix test --only browser:true'
  - name: "\U0001F680 Deploy Checks"
    dependencies:
      - "\U0001F9EA Test Suite"
    task:
      jobs:
        - name: "\U0001F504 Migration Safety"
          commands:
            - mix ecto.migrations
            - mix phx.routes
        - name: "\U0001F4E6 Release Build"
          commands:
            - MIX_ENV=prod mix release --dry-run
  - name: "\U0001F433 Docker"
    dependencies:
      - "\U0001F680 Deploy Checks"
    task:
      secrets:
        - name: dockerhub-credentials
      jobs:
        - name: "\U0001F4E6 Build and Push"
          commands:
            - 'echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin'
            - 'docker build -t "${DOCKER_USERNAME}/phoenix-app:${SEMAPHORE_GIT_SHA:0:7}" .'
            - 'docker push "${DOCKER_USERNAME}/phoenix-app:${SEMAPHORE_GIT_SHA:0:7}"'
